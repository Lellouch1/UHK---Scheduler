<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Builder</title>
<link rel="stylesheet" href="barvicky.css">
</head>
<body>

<header>
  <div class="logo"><img src="artworks-b5vsGeHUiWgEkoyB-ohwNzg-t500x500.jpg" style="width:6rem;height:6rem" alt="logo"></div>
  <img src="monster.jpg" style="width:6rem;height:6rem" alt="best monster">
</header>

<div class="layout">
  <div class="sidebar">
    <div class="search-box"><input type="text" id="searchInput" placeholder="search course, teacher..."></div>
    <div id="courseList"></div>
  </div>

  <div class="main">
    <div class="schedule-toolbar">
      <span class="stat-pill" id="selectedCount">0 selected</span>
      <div class="legend">
        <div class="legend-item"><div class="legend-lec"></div>přednáška</div>
        <div class="legend-item"><div class="legend-sem"></div>cviko</div>
      </div>
      <button class="btn-clear" onclick="clearAll()">clear all</button>
    </div>
    <div class="grid-wrap"><div id="scheduleGrid"></div></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
